name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote'
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create or reuse PR from develop to main
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number=$(gh pr list --state open --base main --head develop --json number --jq '.[0].number')

          if [ -z "$pr_number" ]; then
            pr_number=$(gh pr create \
              --base main \
              --head develop \
              --title "Promote version ${{ github.event.inputs.version }} to production" \
              --body "This PR promotes version ${{ github.event.inputs.version }} from develop to main.")
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Wait for PR approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number="${{ steps.pr.outputs.pr_number }}"
          echo "Waiting for approval on PR #$pr_number"

          for attempt in {1..60}; do
            review_decision=$(gh pr view "$pr_number" --json reviewDecision --jq '.reviewDecision')
            echo "Current review decision: ${review_decision:-none}"

            if [ "$review_decision" = "APPROVED" ]; then
              exit 0
            fi

            sleep 30
          done

          echo "PR was not approved in time."
          exit 1

      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.pr.outputs.pr_number }}" --merge --delete-branch=false

      - name: Create release tag
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git tag "${{ github.event.inputs.version }}"
          git push origin "${{ github.event.inputs.version }}"

    